[package]
name = "anchorpass-pressure"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pressure-rust"
path = "src/main.rs"

[dependencies]
anchorpass = { path = "../../../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "io-util", "io-std", "macros"] }
