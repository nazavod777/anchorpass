[package]
name = "anchorpass"
version = "0.1.1"
edition = "2021"
rust-version = "1.92"
description = "Bounded HTTP protocol client with signed protocol bundles"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/anchorpass"
include = ["src/**", "data/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[features]
default = ["async"]
async = []
blocking = []

[dependencies]
base64 = "0.22"
cookie_store = { version = "=0.22.1", default-features = false }
ed25519-dalek = "2"
fs2 = "0.4"
html5ever = "0.40.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "socks", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "fs", "io-util", "macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
url = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
