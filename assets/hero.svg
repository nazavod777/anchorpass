 fill="#8A8A8A" style="font-size:12px">~/anchorpass</text><text class="l l0" x="24" y="62"><tspan fill="#8A8A8A">$</tspan><tspan fill="#EDEDED"> python -m pip install ./python</tspan></text><text class="l l1" x="24" y="84"><tspan fill="#F5F5F5">✓</tspan><tspan fill="#8A8A8A"> 0.1.1</tspan><tspan fill="#EDEDED"> anchorpass installed</tspan></text><text class="l l2" x="24" y="106"><tspan fill="#8A8A8A">&gt;&gt;&gt;</tspan><tspan fill="#EDEDED"> from anchorpass import Client</tspan></text><text class="l l3" x="24" y="128"><tspan fill="#8A8A8A">&gt;&gt;&gt;</tspan><tspan fill="#EDEDED"> r = Client().solve(anchor_url, action="login")</tspan></text><text class="l l4" x="24" y="150"><tspan fill="#F5F5F5">→</tspan><tspan fill="#8A8A8A"> GET </tspan><tspan fill="#EDEDED"> www.google.com/recaptcha/api2/anchor </tspan><tspan fill="#F5F5F5">200</tspan></text><text class="l l5" x="24" y="172"><tspan fill="#F5F5F5">→</tspan><tspan fill="#8A8A8A"> POST</tspan><tspan fill="#EDEDED"> www.google.com/recaptcha/api2/reload </tspan><tspan fill="#F5F5F5">200</tspan></text><text class="l l6" x="24" y="194"><tspan fill="#8A8A8A">&gt;&gt;&gt;</tspan><tspan fill="#EDEDED"> r.token</tspan></text><text class="l l7" x="24" y="216"><tspan fill="#FFDD00">'03AGdBq26…'</tspan><tspan fill="#8A8A8A">  ← verify the token server-side</tspan></text></svg>
