[package]
name = "anchorpass-live-check"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "anchorpass-live-check"
path = "main.rs"

[dependencies]
anchorpass = { path = "../../../rust", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net"] }
