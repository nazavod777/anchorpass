[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorpass"
version = "0.1.1"
description = "Synchronous and asynchronous HTTP protocol client with explicit proxy routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycurl>=7.49,<8",
    "aiohttp>=3.14,<4",
    "aiohttp-socks>=0.12,<0.13",
    "cryptography>=41",
]
license = "MIT"
license-files = ["LICENSE", "NOTICE"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-pycurl", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anchorpass = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/anchorpass"]
